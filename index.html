<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D CAD Models Showcase &middot; Untube 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }
    .title-group h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-group p.sub {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 6px;
    }
    .search-box {
      position: relative;
      min-width: 260px;
    }
    .search-box input {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 2;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.6), 0 0 24px -4px rgba(56, 189, 248, 0.2);
    }
    .card:hover::before {
      opacity: 1;
    }
    .thumb-wrapper {
      position: relative;
      width: 100%;
      height: 185px;
      background: #0b1120;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px;
      transition: transform 0.35s ease;
    }
    .card:hover .thumb-wrapper img {
      transform: scale(1.05);
    }
    .part-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      z-index: 1;
    }
    .card-body {
      padding: 16px 18px 20px 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.4;
      margin-bottom: 10px;
      word-break: break-word;
    }
    .card-meta {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }
    .card-date {
      color: #64748b;
      font-size: 12px;
    }
    .card-action {
      margin-top: auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: #0ea5e9;
      color: #ffffff;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
      font-size: 15px;
    }
    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 13px;
      color: #475569;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 24px;
    }
    footer a { color: #38bdf8; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1><span>&#128640;</span> UNTUBE 3D CAD GALLERY</h1>
        <p class="sub">Danh m&#7905;c c&aacute;c m&ocirc; h&igrave;nh 3D CAD ki&#7875;m tra b&oacute;c t&aacute;ch WebGL t&#432;&#417;ng t&aacute;c tr&#7921;c tuy&#7871;n.</p>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="&#128269; T&igrave;m ki&#7871;m m&ocirc; h&igrave;nh..." oninput="filterModels()" />
      </div>
    </header>

    <div class="grid" id="modelList">
      <div class="card" data-name="Unnamed-par33" data-title="Unnamed-par33">
        <div class="thumb-wrapper">
          <img src="./Unnamed-par33/thumb.svg" onerror="this.onerror=null; this.src='./Unnamed-par33/thumb.svg';" alt="Unnamed-par33" loading="lazy" />
          <span class="part-badge">70 chi ti&#7871;t</span>
        </div>
        <div class="card-body">
          <h3 class="card-title">Unnamed-par33</h3>
          <div class="card-meta">
            <span class="card-date">&#128197; 2026-11-08 01:27</span>
          </div>
          <div class="card-action">
            <a href="./Unnamed-par33/index.html" class="btn">&#128640; Xem 3D tr&#7921;c tuy&#7871;n</a>
          </div>
        </div>
      </div>
    </div>

    <footer>
      Powered by <strong>Untube 3D Engine</strong> &middot; Hosted free on <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>
    </footer>
  </div>

  <script>
    function filterModels() {
      var q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      var cards = document.querySelectorAll('#modelList .card');
      var visible = 0;
      cards.forEach(function(card) {
        var t = (card.getAttribute('data-title') || '').toLowerCase();
        var n = (card.getAttribute('data-name') || '').toLowerCase();
        if (!q || t.indexOf(q) !== -1 || n.indexOf(q) !== -1) {
          card.style.display = '';
          visible++;
        } else {
          card.style.display = 'none';
        }
      });
      var emptyEl = document.getElementById('noResults');
      if (visible === 0) {
        if (!emptyEl) {
          emptyEl = document.createElement('div');
          emptyEl.id = 'noResults';
          emptyEl.className = 'empty-state';
          emptyEl.innerHTML = '&#128064; Kh&ocirc;ng t&igrave;m th&#7845;y m&ocirc; h&igrave;nh n&agrave;o ph&ugrave; h&#7907;p v&#7899;i t&#7915; kh&oacute;a.';
          document.getElementById('modelList').appendChild(emptyEl);
        }
      } else if (emptyEl) {
        emptyEl.remove();
      }
    }
  </script>
</body>
</html>
